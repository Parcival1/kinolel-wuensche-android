# KinoLel Wünsche (Android): signierte APK, Rauchtest im Emulator (inkl. App-Link-Prüfung), Release bei Tag v*
name: android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6

      - name: Version
        run: |
          VERSION=$(grep '^VERSION=' marke.properties | cut -d= -f2)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION=${GITHUB_REF#refs/tags/v}; fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Signierschlüssel (gleicher wie KinoLel-App)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Secret KEYSTORE_BASE64 fehlt"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kinolel-release.p12"

      - name: Assemble release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/kinolel-release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: kinolel # nicht geheim
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: APK umbenennen + Signatur prüfen
        run: |
          mkdir -p ausgabe
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK" "ausgabe/KinoLel-Wuensche-$APP_VERSION.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "ausgabe/KinoLel-Wuensche-$APP_VERSION.apk" > "$RUNNER_TEMP/signatur.txt"
          grep -i -E "certificate (DN|SHA-256)" "$RUNNER_TEMP/signatur.txt" || cat "$RUNNER_TEMP/signatur.txt"
          rm -f "$RUNNER_TEMP/kinolel-release.p12"

      - uses: actions/upload-artifact@v7
        with:
          name: kinolel-wuensche-apk
          path: ausgabe/*.apk
          if-no-files-found: error

      - name: Vorab-Version veröffentlichen (nur bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ausgabe/*.apk --prerelease --title "Testversion $GITHUB_REF_NAME (KinoLel Wünsche, Android)" --notes-file TESTANLEITUNG.md

  rauchtest:
    name: Rauchtest im Emulator
    needs: build
    runs-on: ubuntu-26.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: kinolel-wuensche-apk
          path: apk
      - name: KVM freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator, App, App-Links, Bildschirmfotos
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          script: bash .github/scripts/rauchtest.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rauchtest-bilder
          path: rauchtest/
