# KinoLel Wünsche (Android): signierte APK, Rauchtest im Emulator (inkl. App-Link-Prüfung), Release bei Tag v*
name: android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6

      - name: Version
        run: |
          VERSION=$(grep '^VERSION=' marke.properties | cut -d= -f2)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION=${GITHUB_REF#refs/tags/v}; fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Signierschlüssel (gleicher wie KinoLel-App)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Secret KEYSTORE_BASE64 fehlt"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kinolel-release.p12"

      - name: Firebase-Konfiguration (Secret GOOGLE_SERVICES_JSON, von Lel)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json; echo "Firebase: eingebunden"
          else echo "Firebase: Secret fehlt – App ohne Push (15-Minuten-Prüfung)"; fi

      - name: Assemble release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/kinolel-release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: kinolel # nicht geheim
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: APK umbenennen + Signatur prüfen
        run: |
          mkdir -p ausgabe
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK" "ausgabe/KinoLel-Wuensche-$APP_VERSION.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "ausgabe/KinoLel-Wuensche-$APP_VERSION.apk" > "$RUNNER_TEMP/signatur.txt"
          grep -i -E "certificate (DN|SHA-256)" "$RUNNER_TEMP/signatur.txt" || cat "$RUNNER_TEMP/signatur.txt"
          rm -f "$RUNNER_TEMP/kinolel-release.p12"

      - uses: actions/upload-artifact@v7
        with:
          name: kinolel-wuensche-apk
          path: ausgabe/*.apk
          if-no-files-found: error

      # Debug-Version (eigenes Paket de.kinolel.wuensche.debug) nur für den Benachrichtigungs-Test im Emulator
      - name: Test-APK (Debug) für den Benachrichtigungs-Test
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: kinolel-wuensche-test-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 3
          if-no-files-found: error

      - name: Vorab-Version als Entwurf anlegen (nur bei Tag v*; veröffentlicht erst nach grünem Test)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ausgabe/*.apk --draft --prerelease --title "Testversion $GITHUB_REF_NAME (KinoLel Wünsche, Android)" --notes-file TESTANLEITUNG.md

  rauchtest:
    name: Rauchtest im Emulator
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: kinolel-wuensche-apk
          path: apk
      - uses: actions/download-artifact@v8
        with:
          name: kinolel-wuensche-test-apk
          path: testapk
      - name: KVM freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Firebase-Dienstkonto für den Push-Test (Secret FCM_DIENSTKONTO, von Lel)
        env:
          FCM_DIENSTKONTO: ${{ secrets.FCM_DIENSTKONTO }}
        run: |
          mkdir -m 700 -p "$RUNNER_TEMP/fcm"
          if [ -n "$FCM_DIENSTKONTO" ]; then (umask 077; printf '%s' "$FCM_DIENSTKONTO" > "$RUNNER_TEMP/fcm/dienstkonto.json"); echo "Dienstkonto: da"
          else echo "Dienstkonto: Secret fehlt – Push-Test wird übersprungen"; fi
      - name: Emulator, App, App-Links, Bildschirmfotos
        env:
          FCM_DIENSTKONTO_DATEI: ${{ runner.temp }}/fcm/dienstkonto.json
          # Vorversion über die GitHub-API finden (ohne Anmeldung oft gesperrt: 60 Anfragen/Std. je Runner-Adresse)
          GH_TOKEN: ${{ github.token }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          script: bash .github/scripts/rauchtest.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rauchtest-bilder
          path: rauchtest/
      - name: Ergebnis prüfen
        run: |
          cat rauchtest/sprache.txt rauchtest/neuigkeiten.txt rauchtest/info.txt rauchtest/benachrichtigungen.txt rauchtest/push.txt 2>/dev/null || true
          if grep -q "PUSH: übersprungen" rauchtest/push.txt 2>/dev/null; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "::error::Push-Test übersprungen (Firebase-Secrets fehlen) – kein Release"; exit 1; fi
            echo "::warning::Push-Test übersprungen (Firebase-Secrets fehlen)"
          fi
          if [ ! -s rauchtest/benachrichtigungen.txt ]; then echo "::error::Benachrichtigungs-Test fehlt"; exit 1; fi
          if grep -hE "FEHLT|FEHLER|NICHT ungarisch|OHNE Antwort|nicht geprüft" rauchtest/sprache.txt rauchtest/neuigkeiten.txt rauchtest/info.txt rauchtest/benachrichtigungen.txt rauchtest/push.txt; then echo "::error::Rauchtest mit Fehlern"; exit 1; fi
          if [ -s rauchtest/abstuerze.txt ]; then cat rauchtest/abstuerze.txt; echo "::error::Absturz im logcat"; exit 1; fi

  veroeffentlichen:
    # Lel 25.10.: erst nach grünem Test sichtbar (Entwurf -> veröffentlicht); apps.json übernimmt nur veröffentlichte
    name: Release veröffentlichen (nur bei Tag v*, nach grünem Test)
    needs: [build, rauchtest]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    steps:
      - name: Entwurf veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
